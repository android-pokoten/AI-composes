services:
  fastf1-libs:
    image: jupyter/base-notebook
    volumes:
      - ./fastf1-libs:/fastf1-libs/
      - ./data:/data/
      - ./cache:/data/cache/
    command:
    - /bin/bash
    - -c
    - |
      cd /fastf1-libs/
      pip install -r requirements-dev.txt
      pip install fastf1_lib/
      start-notebook.py --ip=0.0.0.0 --notebook-dir=/data
    ports:
      - "8888:8888"
